<!DOCTYPE html>
<html lang="zh-Hans" style="background:#eef5f8;color-scheme:light">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="theme-color" content="#eef5f8">
  <title>RianThai</title>
  <script>
    (function () {
      var dark = false;
      try {
        var saved = JSON.parse(localStorage.getItem("daiyin-books-v1") || "null");
        var theme = saved && saved.theme;
        dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      } catch (e) {}
      var root = document.documentElement;
      root.setAttribute("data-theme", dark ? "dark" : "light");
      root.style.background = dark ? "#121a21" : "#eef5f8";
      root.style.colorScheme = dark ? "dark" : "light";
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#121a21" : "#eef5f8");
    })();
  </script>
  <style>
    html, body { margin: 0; background: #eef5f8; color-scheme: light; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #121a21; color-scheme: dark; }
    #boot {
      position: fixed; inset: 0; z-index: 80;
      display: grid; align-content: center; justify-items: center; gap: 18px;
      background:
        radial-gradient(120% 80% at 12% -10%, rgba(90, 180, 210, 0.28), transparent 55%),
        radial-gradient(90% 70% at 100% 0%, rgba(63, 143, 191, 0.16), transparent 45%),
        #eef5f8;
      color: #1f2a32;
      font-family: "Sarabun", "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
      transition: opacity 0.32s ease;
    }
    #boot.is-done { opacity: 0; pointer-events: none; }
    html[data-theme="dark"] #boot {
      background:
        radial-gradient(120% 80% at 12% -10%, rgba(63, 143, 191, 0.22), transparent 55%),
        radial-gradient(90% 70% at 100% 0%, rgba(30, 90, 120, 0.2), transparent 45%),
        #121a21;
      color: #e7eef6;
    }
    .boot-orb {
      position: relative;
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
    }
    .boot-orb svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .boot-tile {
      position: relative;
      z-index: 1;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #6fc4e0, #2f7eab 52%, #1d5f86);
      color: #fff;
      font-family: "Sarabun", "Leelawadee UI", serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
      box-shadow: 0 14px 30px rgba(43, 111, 152, 0.32);
      overflow: hidden;
    }
    .boot-tile::after {
      content: "";
      position: absolute;
      inset: -40% auto auto -20%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, rgba(255,255,255,0.38), transparent 65%);
    }
    .boot-name {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .boot-line { display: grid; justify-items: center; gap: 8px; max-width: min(560px, calc(100% - 40px)); text-align: center; }
    .boot-th, .boot-zh { text-wrap: balance; }
    .boot-th { margin: 0; font-family: "Sarabun", "Leelawadee UI", sans-serif; font-size: 24px; font-weight: 600; line-height: 1.45; color: #2b6f98; }
    .boot-zh { margin: 0; color: #6e7d89; font-size: 17px; line-height: 1.5; }
    html[data-theme="dark"] .boot-th { color: #9adcf0; }
    html[data-theme="dark"] .boot-zh { color: #a9bcc8; }
    .rt-stop { stop-color: #3f8fbf; }
    .rt-spin { transform-origin: 56px 56px; animation: rt-spin 1.15s linear infinite; }
    @keyframes rt-spin { to { transform: rotate(360deg); } }
    html[data-theme="dark"] .rt-stop { stop-color: #9adcf0; }
    @media (prefers-reduced-motion: reduce) {
      #boot { transition: none; }
      .rt-spin { animation: none; }
    }
  </style>
  <meta name="description" content="RianThai。按日常生活 A1 到 B2 分词本，注音用 Paiboon+，句尾礼貌词按说话人性别更换。">
  <meta name="apple-mobile-web-app-title" content="RianThai">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%236fc4e0'/%3E%3Cstop offset='1' stop-color='%231d5f86'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='58' fill='white' font-family='Sarabun,serif'%3Eไ%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="js/rianthai.js?v=368d3e9f1b" as="script">
  <link id="app-css" rel="stylesheet" href="css/app.css?v=368d3e9f1b" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="css/app.css?v=368d3e9f1b"></noscript>
</head>
<body>
  <div id="boot" role="status">
    <div class="boot-orb" aria-hidden="true">
      <svg viewBox="0 0 112 112" fill="none">
        <defs>
          <linearGradient id="rt-arc" x1="16" y1="8" x2="96" y2="104" gradientUnits="userSpaceOnUse">
            <stop class="rt-stop" offset="0" stop-opacity="0"/>
            <stop class="rt-stop" offset=".45" stop-opacity=".35"/>
            <stop class="rt-stop" offset="1" stop-opacity="1"/>
          </linearGradient>
        </defs>
        <circle cx="56" cy="56" r="50" stroke="currentColor" stroke-opacity=".08" stroke-width="2"/>
        <g class="rt-spin">
          <circle cx="56" cy="56" r="50" stroke="url(#rt-arc)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="180 140"/>
        </g>
      </svg>
      <div class="boot-tile">ไ</div>
    </div>
    <p class="boot-name">RianThai</p>
    <div class="boot-line">
      <p class="boot-th" id="boot-th"></p>
      <p class="boot-zh" id="boot-zh"></p>
    </div>
  </div>
  <script>
    (function () {
      var lines = [
        ["ความพยายามอยู่ที่ไหน ความสำเร็จอยู่ที่นั่น", "努力在哪里，成功就在哪里"],
        ["ช้าๆ ได้พร้าเล่มงาม", "慢慢来，终有所成"],
        ["เวลาไม่เคยรอใคร", "时间不等人"],
        ["ทุกอย่างมีทางออกเสมอ", "万事总有出路"],
        ["อย่ากลัวที่จะเริ่มต้น", "不要害怕开始"],
        ["ชีวิตคือการเดินทาง ไม่ใช่จุดหมาย", "人生是一场旅途，而非终点"],
        ["กำลังใจที่ดี คือกำลังใจจากตัวเอง", "最好的鼓励，来自你自己"],
        ["จงมีความสุขกับสิ่งที่คุณมี", "珍惜当下所拥有的，心怀喜乐"]
      ];
      var key = "daiyin-boot-quote";
      var i = 0;
      try { i = parseInt(localStorage.getItem(key), 10); } catch (e) { i = 0; }
      if (isNaN(i) || i < 0 || i >= lines.length) i = 0;
      var line = lines[i];
      document.getElementById("boot-th").textContent = line[0];
      document.getElementById("boot-zh").textContent = line[1];
      document.getElementById("boot").setAttribute("aria-label", line[1]);
      try { localStorage.setItem(key, String((i + 1) % lines.length)); } catch (e) {}
    })();
  </script>
  <div id="flash" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="toast" role="status"></div>
  <script>window.RT_VERSION = "368d3e9f1b";</script>
  <script id="app-js" defer src="js/rianthai.js?v=368d3e9f1b"></script>
  <script>
    (function () {
      var js = document.getElementById("app-js");
      var failed = false;
      function note(message) {
        var boot = document.getElementById("boot");
        if (!boot) return;
        var app = document.getElementById("app");
        if (app && app.children.length) {
          if (boot.parentNode) boot.parentNode.removeChild(boot);
          return;
        }
        var status = document.getElementById("boot-zh");
        if (status && message) status.textContent = message;
      }
      if (js) js.addEventListener("error", function () {
        failed = true;
        note("词库没有载入。请检查网络后刷新页面");
      });
      window.setTimeout(function () {
        if (!failed) note("词库较大，仍在下载");
      }, 20000);
      window.setTimeout(function () {
        if (!failed) note("词库还在载入。若一直停在这里，请刷新页面");
      }, 45000);
    })();
  </script>
</body>
</html>
